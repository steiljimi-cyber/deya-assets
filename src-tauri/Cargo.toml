[package]
name = "fixer-film-lab"
version = "0.1.0"
description = "Fixer Film Lab - analog film photo editor"
edition = "2021"
license = "MIT"

[lib]
name = "fixer_film_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
fixer-core = { path = "../crates/fixer-core" }
serde_json = "1"
anyhow = "1"
