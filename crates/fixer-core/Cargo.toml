[package]
name = "fixer-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
lcms2 = { version = "6", features = ["static"] }  # LittleCMS compiled in: no Homebrew dylib at runtime
jpeg-encoder = "0.7"
png = "0.18"
tiff = "0.11"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1"
walkdir = "2"
sha1_smol = "1"
